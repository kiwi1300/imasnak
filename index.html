<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Customizable Snake Game (XL Edition)</title>
    <style>
        body {
            background-color: #4a752c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
            overflow-y: auto;
            transition: background 0.5s ease, color 0.3s ease;
            position: relative;
        }

        /* Ambient Environment Decorations Box */
        #theme-decorations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-item {
            position: absolute;
            font-size: 42px;
            opacity: 0.85;
            animation: floatAmbient 4s ease-in-out infinite alternate;
        }

        @keyframes floatAmbient {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(10deg); }
        }

        /* Top Layout Box */
        .game-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .main-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Score Bar */
        #score-bar {
            background-color: #4e7a30;
            width: 600px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            box-shadow: 0 6px 8px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }

        .stat {
            color: white;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Game Board */
        #game-board {
            width: 600px;
            height: 600px;
            background-color: #aad751;
            position: relative;
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* Grid Effect */
        .grid-tile {
            position: absolute;
            transition: background-color 0.3s;
        }

        /* Game Elements */
        .snake-head, .snake-body {
            position: absolute;
            border-radius: 6px;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .snake-body {
            z-index: 2;
            opacity: 0.85;
        }

        /* Accessory Styling overlayed on head */
        .accessory-slot {
            position: absolute;
            pointer-events: none;
            z-index: 4;
        }

        .food-item {
            position: absolute;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Overlays */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
        }

        #overlay h2 {
            color: white;
            margin: 0 0 20px 0;
            font-size: 46px;
        }

        #name-input-box {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        #player-name {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 20px;
            text-align: center;
            width: 250px;
        }

        #start-btn {
            background-color: #4674e9;
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #start-btn:hover { background-color: #355ec4; }

        /* Side panels and shared customization styles */
        .side-panel {
            background-color: white;
            color: #333;
            width: 380px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
            transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease;
            border: 2px solid transparent;
        }

        .side-panel h3 { 
            margin-top: 0; 
            font-size: 26px;
            border-bottom: 3px solid #eee; 
            padding-bottom: 10px;
            transition: border-color 0.5s ease;
        }

        /* Customization Grid */
        #custom-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label, .size-panel-label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
            opacity: 0.85;
        }

        .control-group select, .control-group input[type="text"], #boardSize {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            background-color: #fff;
            color: #333;
            transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .color-picker-wrapper input[type="color"] {
            border: none;
            width: 55px;
            height: 40px;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .color-picker-wrapper span {
            font-size: 16px;
            font-weight: bold;
        }

        /* Leaderboard styling */
        #leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #leaderboard-list li {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
            font-size: 18px;
            font-weight: 500;
            transition: border-color 0.5s ease;
        }
        #leaderboard-list li:first-child { color: gold; font-weight: bold; font-size: 20px; }

        /* Board Sizer Layout Panel */
        #size-control-panel {
            width: 600px;
            margin-top: 20px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
        }
        
        #size-control-panel .control-group {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        #size-control-panel label {
            margin-bottom: 0;
            font-size: 16px;
        }

        #boardSize {
            width: 200px;
        }
    </style>
</head>
