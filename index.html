<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Customizable Snake Game (XL Edition)</title>
    <style>
        body {
            background-color: #4a752c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
            overflow-y: auto;
            transition: background 0.5s ease, color 0.3s ease;
            position: relative;
        }

        /* Ambient Environment Decorations Box */
        #theme-decorations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-item {
            position: absolute;
            font-size: 42px;
            opacity: 0.85;
            animation: floatAmbient 4s ease-in-out infinite alternate;
        }

        @keyframes floatAmbient {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(10deg); }
        }

        /* Top Layout Box */
        .game-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .main-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Score Bar */
        #score-bar {
            background-color: #4e7a30;
            width: 600px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            box-shadow: 0 6px 8px rgba(0,0,0,0.1);
            transition: background-color 0.3s, width 0.3s ease;
        }

        .stat {
            color: white;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Game Board */
        #game-board {
            width: 600px;
            height: 600px;
            background-color: #aad751;
            position: relative;
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            overflow: hidden;
            transition: background 0.5s ease, width 0.3s ease, height 0.3s ease;
        }

        /* Grid Effect */
        .grid-tile {
            position: absolute;
            transition: background-color 0.3s;
        }

        /* Game Elements */
        .snake-head, .snake-body {
            position: absolute;
            border-radius: 6px;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .snake-body {
            z-index: 2;
            opacity: 0.85;
        }

        /* Accessory Styling overlayed on head */
        .accessory-slot {
            position: absolute;
            pointer-events: none;
            z-index: 4;
        }

        .food-item {
            position: absolute;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Overlays */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
        }

        #overlay h2 {
            color: white;
            margin: 0 0 20px 0;
            font-size: 46px;
        }

        #name-input-box {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        #player-name {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 20px;
            text-align: center;
            width: 250px;
        }

        #start-btn {
            background-color: #4674e9;
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #start-btn:hover { background-color: #355ec4; }

        /* Side panels and shared customization styles */
        .side-panel {
            background-color: white;
            color: #333;
            width: 380px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
            transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease;
            border: 2px solid transparent;
        }

        .side-panel h3 { 
            margin-top: 0; 
            font-size: 26px;
            border-bottom: 3px solid #eee; 
            padding-bottom: 10px;
            transition: border-color 0.5s ease;
        }

        /* Customization Grid */
        #custom-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label, .size-panel-label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
            opacity: 0.85;
        }

        .control-group select, .control-group input[type="text"], #boardSize {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            background-color: #fff;
            color: #333;
            transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .color-picker-wrapper input[type="color"] {
            border: none;
            width: 55px;
            height: 40px;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .color-picker-wrapper span {
            font-size: 16px;
            font-weight: bold;
        }

        /* Leaderboard styling */
        #leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #leaderboard-list li {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
            font-size: 18px;
            font-weight: 500;
            transition: border-color 0.5s ease;
        }
        #leaderboard-list li:first-child { color: gold; font-weight: bold; font-size: 20px; }

        /* Board Sizer Layout Panel */
        #size-control-panel {
            width: 600px;
            margin-top: 20px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            transition: width 0.3s ease;
        }
        
        #size-control-panel .control-group {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        #size-control-panel label {
            margin-bottom: 0;
            font-size: 16px;
        }

        #boardSize {
            width: 200px;
        }
    </style>
</head>
<body>

    <div id="theme-decorations"></div>

    <div class="game-container">
        
        <div class="side-panel" id="custom-panel">
            <h3>Customization</h3>
            
            <div class="control-group">
                <label>Snake Color (Color Wheel)</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="snakeColor" value="#4674e9" onchange="updateStyles()">
                    <span id="colorHex">#4674e9</span>
                </div>
            </div>

            <div class="control-group">
                <label>Accessory</label>
                <select id="snakeAccessory">
                    <option value="">None</option>
                    <option value="👑">Crown 👑</option>
                    <option value="🕶️">Sunglasses 🕶️</option>
                    <option value="🤠">Cowboy Hat 🤠</option>
                    <option value="🎩">Top Hat 🎩</option>
                    <option value="🎀">Ribbon Bow 🎀</option>
                    <option value="🎧">Headphones 🎧</option>
                    <option value="😇">Halo 😇</option>
                </select>
            </div>
        </div>

        <div class="main-column">
            <div id="score-bar">
                <div class="stat">🍎 <span id="current-score">0</span></div>
                <div class="stat">🏆 <span id="high-score">0</span></div>
            </div>

            <div id="game-board">
                <div id="overlay">
                    <h2 id="overlay-title">SNAKE GAME</h2>
                    <div id="name-input-box">
                        <input type="text" id="player-name" placeholder="Enter Name..." maxlength="10">
                    </div>
                    <button id="start-btn" onclick="startGame()">START</button>
                </div>
            </div>

            <div class="side-panel" id="size-control-panel">
                <div class="control-group">
                    <label for="boardSize">Playing Board Size</label>
                    <select id="boardSize" onchange="changeBoardSize()">
                        <option value="400">Small (400x400)</option>
                        <option value="600" selected>Normal (600x600)</option>
                        <option value="800">Large (800x800)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <h3>Leaderboard</h3>
            <ul id="leaderboard-list">
                <li><span>1. AAA</span><span>120</span></li>
                <li><span>2. BBB</span><span>95</span></li>
                <li><span>3. CCC</span><span>70</span></li>
            </ul>
        </div>

    </div>

    <script>
        // Game Logic Globals
        const board = document.getElementById('game-board');
        const scoreBar = document.getElementById('score-bar');
        const sizeControlPanel = document.getElementById('size-control-panel');
        const boardSizeSelector = document.getElementById('boardSize');
        const scoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');

        let boardPixels = 600; 
        let tileSize = 30;     
        let gridUnits = boardPixels / tileSize; 

        let snake = [];
        let direction = { x: 0, y: 0 };
        let nextDirection = { x: 0, y: 0 };
        let food = { x: 0, y: 0 };
        let score = 0;
        let highScore = 0;
        let gameInterval = null;
        let isPlaying = false;

        // Initialize grid visual backgrounds
        function drawGridBackground() {
            // Clear prior grid loops
            const oldTiles = board.querySelectorAll('.grid-tile');
            oldTiles.forEach(tile => tile.remove());

            for (let r = 0; r < gridUnits; r++) {
                for (let c = 0; c < gridUnits; c++) {
                    if ((r + c) % 2 === 0) {
                        const tile = document.createElement('div');
                        tile.classList.add('grid-tile');
                        tile.style.width = tileSize + 'px';
                        tile.style.height = tileSize + 'px';
                        tile.style.left = (c * tileSize) + 'px';
                        tile.style.top = (r * tileSize) + 'px';
                        tile.style.backgroundColor = '#a2d149'; 
                        board.appendChild(tile);
                    }
                }
            }
        }

        // Live Size Mutator Function 
        function changeBoardSize() {
            if (isPlaying) return; // Prevent adjustment mid-game

            // Grab dimensions
            boardPixels = parseInt(boardSizeSelector.value);
            gridUnits = boardPixels / tileSize;

            // Resize DOM elements simultaneously so everything fits flush
            board.style.width = boardPixels + 'px';
            board.style.height = boardPixels + 'px';
            scoreBar.style.width = boardPixels + 'px';
            sizeControlPanel.style.width = boardPixels + 'px';

            // Regenerate background checkerboard pattern
            drawGridBackground();
        }

        function updateStyles() {
            const picker = document.getElementById('snakeColor');
            document.getElementById('colorHex').innerText = picker.value.toUpperCase();
            
            // Re-render elements color instantly if existing
            const parts = board.querySelectorAll('.snake-head, .snake-body');
            parts.forEach(p => p.style.backgroundColor = picker.value);
        }

        function spawnFood() {
            // Clean up old target food instances
            const oldFood = board.querySelector('.food-item');
            if(oldFood) oldFood.remove();

            // Rely directly on dynamic current calculation rules safely
            food.x = Math.floor(Math.random() * gridUnits);
            food.y = Math.floor(Math.random() * gridUnits);

            // Verify food doesn't land inside the snake
            for(let cell of snake) {
                if(cell.x === food.x && cell.y === food.y) {
                    spawnFood();
                    return;
                }
            }

            const foodEl = document.createElement('div');
            foodEl.classList.add('food-item');
            foodEl.style.width = tileSize + 'px';
            foodEl.style.height = tileSize + 'px';
            foodEl.style.left = (food.x * tileSize) + 'px';
            foodEl.style.top = (food.y * tileSize) + 'px';
            foodEl.innerText = "🍎";
            foodEl.style.fontSize = (tileSize * 0.8) + 'px';
            board.appendChild(foodEl);
        }

        function startGame() {
            overlay.style.display = 'none';
            boardSizeSelector.disabled = true; // Lock resizing during gameplay
            
            // Default setup values
            score = 0;
            scoreEl.innerText = score;
            const mid = Math.floor(gridUnits / 2);
            snake = [
                { x: mid, y: mid },
                { x: mid, y: mid + 1 },
                { x: mid, y: mid + 2 }
            ];
            direction = { x: 0, y: -1 };
            nextDirection = { x: 0, y: -1 };
            isPlaying = true;

            spawnFood();
            renderSnake();

            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 150);
        }

        function gameLoop() {
            direction = nextDirection;
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Check walls boundaries dynamically
            if (head.x < 0 || head.x >= gridUnits || head.y < 0 || head.y >= gridUnits) {
                gameOver();
                return;
            }

            // Check body collisions
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            // Move head
            snake.unshift(head);

            // Check food consumption
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.innerText = highScore;
                }
                spawnFood();
            } else {
                snake.pop();
            }

            renderSnake();
        }

        function renderSnake() {
            // Purge old snake layers
            board.querySelectorAll('.snake-head, .snake-body').forEach(el => el.remove());
            const chosenColor = document.getElementById('snakeColor').value;
            const accessory = document.getElementById('snakeAccessory').value;

            snake.forEach((segment, index) => {
                const segEl = document.createElement('div');
                segEl.style.width = (tileSize - 2) + 'px';
                segEl.style.height = (tileSize - 2) + 'px';
                segEl.style.left = (segment.x * tileSize + 1) + 'px';
                segEl.style.top = (segment.y * tileSize + 1) + 'px';
                segEl.style.backgroundColor = chosenColor;

                if (index === 0) {
                    segEl.classList.add('snake-head');
                    // Inject accessory item inside the head block element cleanly
                    if (accessory) {
                        const accEl = document.createElement('div');
                        accEl.classList.add('accessory-slot');
                        accEl.innerText = accessory;
                        accEl.style.fontSize = (tileSize * 0.7) + 'px';
                        accEl.style.top = `-${tileSize * 0.3}px`;
                        segEl.appendChild(accEl);
                    }
                } else {
                    segEl.classList.add('snake-body');
                }
                board.appendChild(segEl);
            });
        }

        function gameOver() {
            clearInterval(gameInterval);
            isPlaying = false;
            boardSizeSelector.disabled = false; // Re-enable resizing
            overlayTitle.innerText = "GAME OVER";
            document.getElementById('start-btn').innerText = "RESTART";
            overlay.style.display = 'flex';
        }

        // Handle Keyboard Events
        window.addEventListener('keydown', e => {
            if (!isPlaying) return;
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        });

        // Initial setup run
        drawGridBackground();
    </script>
</body>
</html>
