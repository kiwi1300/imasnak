<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Customizable Snake Game (Google Style)</title>
    <style>
        body {
            background-color: #4a752c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
            overflow-y: auto;
            transition: background 0.5s ease;
            position: relative;
        }

        #theme-decorations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-item {
            position: absolute;
            font-size: 42px;
            opacity: 0.35;
            animation: floatAmbient 4s ease-in-out infinite alternate;
        }

        @keyframes floatAmbient {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(10deg); }
        }

        .game-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .main-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: transparent;
        }

        #score-bar {
            background-color: #4e7a30;
            width: 600px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            box-shadow: 0 6px 8px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }

        .stat {
            color: white;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #game-board {
            width: 600px;
            height: 600px;
            background-color: #aad751;
            position: relative;
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            overflow: hidden;
            transition: background 0.5s ease;
        }
