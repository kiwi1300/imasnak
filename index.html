<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Google Snake Clone</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #4caf50;
        }
        /* UI Overlay Styling */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            background-color: #4285f4;
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stats-container {
            background-color: #8ab4f8;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #1557b0;
        }
        .hidden {
            display: none !important;
        }
        #top-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            gap: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="top-bar">
        <span id="hud-score">🍎 0</span>
        <span id="hud-trophy">🏆 0</span>
    </div>

    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <div id="main-menu" class="overlay">
        <div class="stats-container">
            <div class="stat-item"><span>🍎</span><span id="menu-score">0</span></div>
            <div class="stat-item"><span>🏆</span><span id="menu-high">0</span></div>
        </div>
        <button class="btn" onclick="startGame('normal')">▶ Play</button>
        <button class="btn" onclick="toggleDailyChallengeMenu()">⭐ Daily Challenge</button>
    </div>

    <div id="daily-menu" class="overlay hidden">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: -5px;">Daily Challenge</div>
        <div style="font-size: 12px; opacity: 0.8;" id="current-date">2026-06-13</div>
        <div class="stats-container" style="font-size: 18px;">
            <div>🌀 Portals</div>
            <div>📦 Crates</div>
        </div>
        <button class="btn" onclick="startGame('challenge')">▶ Play Challenge</button>
        <button class="btn" style="background-color: #5f6368;" onclick="showMainMenu()">⬅ Back</button>
    </div>
</div>

        document.getElementById('main-menu').classList.remove('hidden');

        document.getElementById('menu-high').innerText = highScore;
    }

    function toggleDailyChallengeMenu() {
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('daily-menu').classList.remove('hidden');
