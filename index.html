<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Custom Snake Game</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #4caf50;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1000px;
            width: 100%;
        }

        .panel {
            background: var(--panel-color);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #game-settings {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"], input[type="color"], select {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: none;
            background: #444;
            color: white;
            box-sizing: border-box;
        }

        .checkbox-group {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        .checkbox-group input {
            width: 20px;
            height: 20px;
        }

        #game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        canvas {
            background: #111;
            border: 4px solid #444;
            border-radius: 5px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 1.2rem;
            font-weight: bold;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: #45a049;
        }

        .controls-hint {
            text-align: center;
            font-size: 0.85rem;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Custom Snake Engine</h1>

    <div class="container">
        <div id="game-settings" class="panel">
            <h3>Customization Menu</h3>
            
            <div class="setting-group">
                <label>Snake Color</label>
                <input type="color" id="snakeColor" value="#4caf50">
            </div>

            <div class="setting-group">
