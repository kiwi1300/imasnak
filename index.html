<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Customizable Snake Game (Google Style)</title>
    <style>
        body {
            background-color: #4a752c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
            overflow-y: auto;
            transition: background 0.5s ease;
            position: relative;
        }

        #theme-decorations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-item {
            position: absolute;
            font-size: 42px;
            opacity: 0.35;
            animation: floatAmbient 4s ease-in-out infinite alternate;
        }

        @keyframes floatAmbient {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(10deg); }
        }

        .game-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .main-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: transparent;
        }

        #score-bar {
            background-color: #4e7a30;
            width: 600px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            box-shadow: 0 6px 8px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }

        .stat {
            color: white;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #game-board {
            width: 600px;
            height: 600px;
            background-color: #aad751;
            position: relative;
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        .grid-tile {
            position: absolute;
            width: 30px;
            height: 30px;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: rgba(0, 0, 0, 0.15);
            user-select: none;
        }

        #light-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle 90px at center, transparent 100%, rgba(0,0,0,0.95) 100%);
            pointer-events: none;
            z-index: 5;
            display: none;
        }

        .snake-head {
            position: absolute;
            width: 30px;
            height: 30px;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .snake-eyes {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            box-sizing: border-box;
        }

        .eyes-up { transform: rotate(0deg); }
        .eyes-right { transform: rotate(90deg); }
        .eyes-down { transform: rotate(180deg); }
        .eyes-left { transform: rotate(270deg); }

        .eye {
            width: 8px;
            height: 8px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-left { left: 4px; }
        .eye-right { right: 4px; }

        .pupil {
            width: 4px;
            height: 4px;
            background-color: #000;
            border-radius: 50%;
            position: absolute;
            top: 0px; 
        }

        .snake-tongue {
            position: absolute;
            width: 4px;
            height: 8px;
            background-color: #ff3b30;
            top: -6px;
            left: 13px;
            border-radius: 2px 2px 0 0;
            z-index: 3;
            transform-origin: bottom center;
            animation: flick 0.15s infinite alternate;
            display: none;
        }

        @keyframes flick {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(1.4) scaleX(0.9); }
        }

        .snake-body {
            position: absolute;
            width: 30px;
            height: 30px;
            z-index: 2;
            box-sizing: border-box;
        }

        .accessory-slot {
            position: absolute;
            font-size: 22px;
            top: -12px;
            pointer-events: none;
            z-index: 5;
        }

        .food-item, .obstacle-item, .key-item {
            position: absolute;
            width: 30px;
            height: 30px;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
        }

        #overlay h2 {
            color: white;
            margin: 0 0 20px 0;
            font-size: 46px;
        }

        #name-input-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        #player-name {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 20px;
            text-align: center;
            width: 250px;
        }

        #start-btn {
            background-color: #4674e9;
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #start-btn:hover { background-color: #355ec4; }

        #end-round-btn {
            background-color: #d90429;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.1s;
        }
        #end-round-btn:hover { background-color: #b30322; }
        #end-round-btn:active { transform: scale(0.98); }

        .side-panel {
            background-color: white;
            width: 380px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .side-panel h3 { 
            margin-top: 0; 
            color: #333; 
            font-size: 26px;
            border-bottom: 3px solid #eee; 
            padding-bottom: 10px;
        }

        #custom-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .control-group select, .control-group input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        #blender-options-box {
            background-color: #f7f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            margin-top: 6px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .blender-checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 500;
            color: #444;
            cursor: pointer;
        }

        .blender-checkbox-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .color-picker-wrapper input[type="color"] {
            border: none;
            width: 55px;
            height: 40px;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .color-picker-wrapper span {
            font-size: 16px;
            font-weight: bold;
        }

        #leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #leaderboard-list li {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
            font-size: 18px;
            font-weight: 500;
        }
        #leaderboard-list li:first-child { color: gold; font-weight: bold; font-size: 20px; }
    </style>
</head>
