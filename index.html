<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Customizable Snake Game</title>
    <style>
        body {
            background-color: #4a752c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            transition: background 0.5s ease, color 0.3s ease;
            position: relative;
        }

        /* Ambient Environment Decorations Box */
        #theme-decorations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-item {
            position: absolute;
            font-size: 36px;
            opacity: 0.85;
            animation: floatAmbient 4s ease-in-out infinite alternate;
        }

        @keyframes floatAmbient {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-10px) rotate(8deg); }
        }

        /* Top Layout Box */
        .game-container {
            display: flex;
            gap: 30px;
            width: 85vw;
            min-width: 1200px;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            z-index: 1;
        }

        /* Centralizes the game arena structure inside the layout */
        .main-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 0 0 600px;
        }

        /* Top Score Bar */
        #score-bar {
            background-color: #4e7a30;
            width: 600px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }

        .stat {
            color: white;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Game Board */
        #game-board {
            width: 600px;
            height: 600px;
            background-color: #aad751;
            position: relative;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* Grid Effect */
        .grid-tile {
            position: absolute;
            transition: background-color 0.3s;
        }

        /* Game Elements */
        .snake-head, .snake-body {
            position: absolute;
            border-radius: 6px;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .snake-body {
            z-index: 2;
            opacity: 0.85;
        }

        /* Accessory Styling overlayed on head */
        .accessory-slot {
            position: absolute;
            pointer-events: none;
            z-index: 4;
        }

        .food-item {
            position: absolute;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Overlays */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 10;
        }

        #overlay h2 {
            color: white;
            margin: 0 0 15px 0;
            font-size: 46px;
        }

        #name-input-box {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        #player-name {
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-size: 20px;
            text-align: center;
        }

        #start-btn {
            background-color: #4674e9;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #start-btn:hover { background-color: #355ec4; }

        /* Side panels - Themed transition options */
        .side-panel {
            background-color: white;
            color: #333;
            flex: 1;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            transition: background-color 0.5s ease, color 0.5s ease, border 0.5s ease;
        }

        .side-panel h3 { 
            margin-top: 0; 
            font-size: 24px;
            border-bottom: 3px solid rgba(0,0,0,0.1); 
            padding-bottom: 8px;
            transition: border-color 0.5s ease;
        }

        /* Customization Grid */
        #custom-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .control-group select, .control-group input[type="text"], #boardSizeSelect {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            background-color: #fff;
            color: #333;
            transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .color-picker-wrapper input[type="color"] {
            border: none;
            width: 50px;
            height: 40px;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .color-picker-wrapper span {
            font-size: 16px;
        }

        /* Leaderboard styling */
        #leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #leaderboard-list li {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(0,0,0,0.1);
            font-weight: 500;
            font-size: 18px;
            transition: border-color 0.5s ease;
        }
        #leaderboard-list li:first-child { color: gold; font-weight: bold; font-size: 20px; }

        /* Bottom Menu Control Bar */
        .bottom-controls {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 1;
            width: 100%;
            max-width: 600px;
        }

        .size-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .size-panel label {
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Mobile Breakout fallback if window is narrow */
        @media (max-width: 1220px) {
            .game-container {
                width: 95vw;
                min-width: auto;
                flex-wrap: wrap;
            }
            .side-panel {
                flex: none;
                width: 100%;
                max-width: 600px;
            }
        }
    </style>
</head>

    <div id="theme-decorations"></div>

    <div class="game-container">
        
        <div class="side-panel" id="custom-panel">
            <h3>Customization</h3>
            
            <div class="control-group">
                <label>Snake Color (Color Wheel)</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="snakeColor" value="#4674e9" onchange="updateStyles()">
                    <span id="colorHex">#4674e9</span>
                </div>
            </div>

            <div class="control-group">
                <label>Accessory</label>
                <select id="snakeAccessory">
                    <option value="">None</option>
                    <option value="👑">Crown 👑</option>
                    <option value="🕶️">Sunglasses 🕶️</option>
                    <option value="🤠">Cowboy Hat 🤠</option>
                    <option value="🎩">Top Hat 🎩</option>
                    <option value="🎀">Ribbon Bow 🎀</option>
                    <option value="🎧">Headphones 🎧</option>
                    <option value="😇">Halo 😇</option>
                </select>
            </div>

            <div class="control-group">
                <label>Theme & Environment</label>
                <select id="mapTheme" onchange="updateMapTheme()">
                    <option value="classic">Google Green (Classic)</option>
                    <option value="beach">🏖️ Turquoise Beach</option>
                    <option value="desert">🏜️ Outback Desert</option>
                    <option value="candy">🍬 Sweet Candy Kingdom</option>
                    <option value="forest">🌲 Deep Grizzly Forest</option>
                    <option value="magma">🌋 Volcanic Magma Cave</option>
                    <option value="space">🚀 Deep Outer Space</option>
                    <option value="snow">❄️ Arctic Ice Blizzard</option>
                    <option value="cyber">⚡ Neon Cyber Grid</option>
                    <option value="retro">🕹️ Old-School Arcade</option>
                </select>
            </div>

            <div class="control-group">
                <label>Food Item</label>
                <select id="foodType" onchange="updateFoodIcon()">
                </select>
            </div>

            <div class="control-group">
                <label>Game Speed</label>
                <select id="gameSpeed" onchange="updateSpeed()">

                    <option value="100" selected>Normal</option>
                    <option value="70">Fast</option>
                    <option value="45">Hyper</option>
                </select>
            </div>

            <div class="control-group">
                <label>Food Count</label>
                <select id="foodAmount">
                    <option value="1">1 (Standard)</option>
                    <option value="3">3</option>
                    <option value="5">5</option>
                </select>
            </div>
        </div>

        <div class="main-column">
            <div id="score-bar">
                <div class="stat"><span id="score-icon">🍎</span> <span id="score">0</span></div>
                <div class="stat">🏆 <span id="high-score">0</span></div>
            </div>

            <div id="game-board">
                <div id="overlay">
                    <h2 id="overlay-text">Snake Game</h2>
                    <div id="name-input-box">
                        <label style="color: white; font-size: 16px;">Enter your name for Leaderboard:</label>
                        <input type="text" id="player-name" placeholder="Player 1" maxlength="12">
                    </div>
                    <button id="start-btn" onclick="startGame()">Play</button>
                </div>
            </div>

            <div class="bottom-controls">
                <div class="side-panel size-panel" id="size-panel">
                    <label for="boardSizeSelect">Board Layout Size Layout:</label>
                    <select id="boardSizeSelect" onchange="changeBoardSize()">
                        <option value="15">Small (15x15)</option>
                        <option value="20" selected>Normal (20x20)</option>
                        <option value="25">Large (25x25)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="side-panel" id="leaderboard-panel">
            <h3>Leaderboard</h3>
            <ul id="leaderboard-list">
            </ul>
        </div>

    </div>
