<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Customizable Snake Game</title>
    <style>
        body {
            background-color: #4a752c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            transition: background 0.5s ease;
            position: relative;
        }

        /* Ambient Environment Decorations Box */
        #theme-decorations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-item {
            position: absolute;
            font-size: 42px;
            opacity: 0.85;
            animation: floatAmbient 4s ease-in-out infinite alternate;
        }

        @keyframes floatAmbient {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-10px) rotate(8deg); }
        }

        /* Top Layout Box - Expanded layout width to comfortably fit up to a 900px board */
        .game-container {
            display: flex;
            gap: 35px;
            width: 90vw;
            min-width: 1300px;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            z-index: 1;
        }

        /* Centralizes the game arena structure inside the layout */
        .main-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Flex basis will adjust via JS logic depending on chosen map width */
            transition: flex 0.3s ease;
        }

        /* Top Score Bar */
        #score-bar {
            background-color: #4e7a30;
            width: 600px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top-left-radius: 14px;
            border-top-right-radius: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s, width 0.3s ease;
        }

        .stat {
            color: white;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Game Board */
        #game-board {
            width: 600px;
            height: 600px;
            background-color: #aad751;
            position: relative;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            overflow: hidden;
            transition: background 0.5s ease, width 0.3s ease, height 0.3s ease;
        }

        /* Grid Effect */
        .grid-tile {
            position: absolute;
            transition: background-color 0.3s;
        }

        /* Game Elements */
        .snake-head, .snake-body {
            position: absolute;
            border-radius: 6px;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .snake-body {
            z-index: 2;
            opacity: 0.85;
        }

        /* Accessory Styling overlayed on head */
        .accessory-slot {
            position: absolute;
            pointer-events: none;
            z-index: 4;
        }

        .food-item {
            position: absolute;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Overlays */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            z-index: 10;
        }

        #overlay h2 {
            color: white;
            margin: 0 0 15px 0;
            font-size: 52px;
        }

        #name-input-box {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        #player-name {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 22px;
            text-align: center;
        }

        #start-btn {
            background-color: #4674e9;
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #start-btn:hover { background-color: #355ec4; }

        /* Side panels styled cleanly with robust structural spacing */
        .side-panel {
            background-color: white;
            flex: 1;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .side-panel h3 { 
            margin-top: 0; 
            color: #333; 
            font-size: 26px;
            border-bottom: 3px solid #eee; 
            padding-bottom: 10px;
        }

        /* Customization Grid */
        #custom-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-size: 15px;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .control-group select, .control-group input[type="text"] {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 18px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .color-picker-wrapper input[type="color"] {
            border: none;
            width: 60px;
            height: 45px;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .color-picker-wrapper span {
            font-size: 18px;
        }

        /* Leaderboard styling */
        #leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #leaderboard-list li {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed #eee;
            font-weight: 500;
            font-size: 20px;
        }
        #leaderboard-list li:first-child { color: gold; font-weight: bold; font-size: 22px; }

        /* Mobile Breakout fallback if window is narrow */
        @media (max-width: 1320px) {
            .game-container {
                width: 95vw;
                min-width: auto;
                flex-wrap: wrap;
            }
            .side-panel {
                flex: none;
                width: 100%;
                max-width: 600px;
            }
        }
    </style>
</head>
<body>

    <div id="theme-decorations"></div>

                <select id="mapTheme" onchange="updateMapTheme()">

                    <option value="magma">🌋 Volcanic Magma Cave</option>

                    <option value="cyber">⚡ Neon Cyber Grid</option>
                    <option value="retro">🕹️ Old-School Arcade</option>
                </select>
            </div>

                <label>Food Item</label>
                <select id="foodType" onchange="updateFoodIcon()">
                </select
