<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Game Example</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            color: white;
            font-family: sans-serif;
        }
        #game-container {
            width: 800px;
            height: 600px;
            background-color: #333;
            border: 2px solid #555;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>My Awesome Game</h1>
        <button id="start-btn">Start Game (Fullscreen)</button>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const gameContainer = document.getElementById('game-container');

        startBtn.addEventListener('click', () => {
            // Request fullscreen on the game container
            if (gameContainer.requestFullscreen) {
                gameContainer.requestFullscreen();
            } else if (gameContainer.webkitRequestFullscreen) { /* Safari */
                gameContainer.webkitRequestFullscreen();
            } else if (gameContainer.msRequestFullscreen) { /* IE11 */
                gameContainer.msRequestFullscreen();
            }
            
            // Optional: Hide the start button or trigger your actual game loop here
            startBtn.style.display = 'none'; 
        });

        // Listen for when the user exits fullscreen (like pressing Escape)
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                // This runs when the user EXITS fullscreen mode
                startBtn.style.display = 'block'; // Bring the button back
            }
        });
    </script>

</body>
</html>
