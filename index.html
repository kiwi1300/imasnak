<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Customizable Snake Game</title>
    <style>
        body {
            background-color: #4a752c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            transition: background 0.5s ease;
            position: relative;
        }

        /* Ambient Environment Decorations Box */
        #theme-decorations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-item {
            position: absolute;
            font-size: 42px;
            opacity: 0.85;
            animation: floatAmbient 4s ease-in-out infinite alternate;
        }

        @keyframes floatAmbient {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-10px) rotate(8deg); }
        }

        /* Top Layout Box - Forces the row group to take exactly 92% of viewport width */
        .game-container {
            display: flex;
            gap: 35px;
            width: 92vw;
            min-width: 1350px; /* Ensures panels don't squish past usability on small displays */
            justify-content: center;
            align-items: flex-start;
            position: relative;
            z-index: 1;
        }

        /* Centralizes the game arena structure inside the layout */
        .main-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 0 0 750px; /* Locks the middle game column structure safely to 750px wide */
        }
