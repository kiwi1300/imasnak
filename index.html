<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Customizable Snake Game</title>
    <style>
        body {
            background-color: #4a752c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            transition: background 0.5s ease;
            position: relative;
        }

        /* Ambient Environment Decorations Box */
        #theme-decorations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-item {
            position: absolute;
            font-size: 28px;
            opacity: 0.85;
            animation: floatAmbient 4s ease-in-out infinite alternate;
        }

        @keyframes floatAmbient {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-10px) rotate(8deg); }
        }

        /* Top Layout Box */
        .game-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .main-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Score Bar */
        #score-bar {
            background-color: #4e7a30;
            width: 400px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }

        .stat {
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Game Board */
        #game-board {
            width: 400px;
            height: 400px;
            background-color: #aad751;
            position: relative;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* Grid Effect */
        .grid-tile {
            position: absolute;
            width: 20px;
            height: 20px;
            transition: background-color 0.3s;
        }

        /* Game Elements */
        .snake-head, .snake-body {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .snake-body {
            z-index: 2;
            opacity: 0.85;
        }

        /* Accessory Styling overlayed on head */
        .accessory-slot {
            position: absolute;
            font-size: 14px;
            top: -6px;
            pointer-events: none;
            z-index: 4;
        }

        .food-item {
            position: absolute;
            width: 20px;
            height: 20px;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* Overlays */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            z-index: 10;
        }

        #overlay h2 {
            color: white;
            margin: 0 0 10px 0;
            font-size: 32px;
        }

        #name-input-box {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        #player-name {
            padding: 8px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            text-align: center;
        }

        #start-btn {
            background-color: #4674e9;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #start-btn:hover { background-color: #355ec4; }

        /* Side panels */
        .side-panel {
            background-color: white;
            width: 320px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .side-panel h3 { margin-top: 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 5px;}

        /* Customization Grid */
        #custom-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .control-group select, .control-group input[type="text"] {
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-picker-wrapper input[type="color"] {
            border: none;
            width: 40px;
            height: 30px;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        /* Leaderboard styling */
        #leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #leaderboard-list li {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #eee;
            font-weight: 500;
        }
        #leaderboard-list li:first-child { color: gold; font-weight: bold; }
    </style>
</head>
<body>

    <div id="theme-decorations"></div>

    <div class="game-container">
        
        <div class="side-panel" id="custom-panel">
            <h3>Customization</h3>
            
            <div class="control-group">
                <label>Snake Color (Color Wheel)</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="snakeColor" value="#4674e9" onchange="updateStyles()">
                    <span id="colorHex">#4674e9</span>
                </div>
            </div>

            <div class="control-group">
                <label>Accessory</label>
                <select id="snakeAccessory">
                    <option value="">None</option>
                    <option value="👑">Crown 👑</option>
                    <option value="🕶️">Sunglasses 🕶️</option>
                    <option value="🤠">Cowboy Hat 🤠</option>
                    <option value="🎩">Top Hat 🎩</option>
                    <option value="🎀">Ribbon Bow 🎀</option>
                    <option value="🎧">Headphones 🎧</option>
                    <option value="😇">Halo 😇</option>
                </select>
            </div>

            <div class="control-group">
                <label>Theme & Environment</label>
                <select id="mapTheme" onchange="updateMapTheme()">
                    <option value="classic">Google Green (Classic)</option>
                    <option value="beach">🏖️ Turquoise Beach</option>
                    <option value="desert">🏜️ Outback Desert</option>
                    <option value="candy">🍬 Sweet Candy Kingdom</option>
                    <option value="forest">🌲 Deep Grizzly Forest</option>
                    <option value="magma">🌋 Volcanic Magma Cave</option>
                    <option value="space">🚀 Deep Outer Space</option>
                    <option value="snow">❄️ Arctic Ice Blizzard</option>
                    <option value="cyber">⚡ Neon Cyber Grid</option>
                    <option value="retro">🕹️ Old-School Arcade</option>
                </select>
            </div>

            <div class="control-group">
                <label>Food Item</label>
                <select id="foodType" onchange="updateFoodIcon()">
                </select>
            </div>

            <div class="control-group">
                <label>Game Speed</label>
                <select id="gameSpeed" onchange="updateSpeed()">
                    <option value="150">Slow</option>
                    <option value="100" selected>Normal</option>
                    <option value="70">Fast</option>
                    <option value="45">Hyper</option>
                </select>
            </div>

            <div class="control-group">
                <label>Food Count</label>
                <select id="foodAmount">
                    <option value="1">1 (Standard)</option>
                    <option value="3">3</option>
                    <option value="5">5</option>
                </select>
            </div>
        </div>

        <div class="main-column">
            <div id="score-bar">
                <div class="stat"><span id="score-icon">🍎</span> <span id="score">0</span></div>
                <div class="stat">🏆 <span id="high-score">0</span></div>
            </div>

            <div id="game-board">
                <div id="overlay">
                    <h2 id="overlay-text">Snake Game</h2>
                    <div id="name-input-box">
                        <label style="color: white; font-size: 14px;">Enter your name for Leaderboard:</label>
                        <input type="text" id="player-name" placeholder="Player 1" maxlength="12">
                    </div>
                    <button id="start-btn" onclick="startGame()">Play</button>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <h3>Leaderboard</h3>
            <ul id="leaderboard-list">
            </ul>
        </div>

    </div>

    <script>
        const board = document.getElementById('game-board');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const scoreIconEl = document.getElementById('score-icon');
        const overlay = document.getElementById('overlay');
        const overlayText = document.getElementById('overlay-text');
        const startBtn = document.getElementById('start-btn');
        const nameInputBox = document.getElementById('name-input-box');
        const playerNameInput = document.getElementById('player-name');
        const leaderboardList = document.getElementById('leaderboard-list');
        const decorContainer = document.getElementById('theme-decorations');

        // Form elements
        const optSnakeColor = document.getElementById('snakeColor');
        const colorHexSpan = document.getElementById('colorHex');
        const optAccessory = document.getElementById('snakeAccessory');
        const optMapTheme = document.getElementById('mapTheme');
        const optFoodType = document.getElementById('foodType');
        const optGameSpeed = document.getElementById('gameSpeed');
        const optFoodAmount = document.getElementById('foodAmount');

        const tileSize = 20;
        const gridCount = 20;

        let snake = [];
        let foodList = [];
        let dx = tileSize;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let gameRunning = false;
        let changingDirection = false;

        // Enhanced themes with complete world design architectures
        const themes = {
            classic: { 
                bg: '#4a752c', boardBg: '#aad751', light: '#aad751', dark: '#a2d149', header: '#4e7a30',
                decorations: ["🌱", "🌿", "🍀", "☘️"]
            },
            beach: { 
                bg: 'linear-gradient(to bottom, #00afb9, #fed9b7)', 
                boardBg: 'linear-gradient(to bottom, #00f2fe 0%, #4facfe 55%, #f7f0da 55%, #f5e6ca 100%)', 
                light: 'rgba(255,255,255,0.12)', dark: 'rgba(0,0,0,0.04)', header: '#0077b6',
                decorations: ["🦀", "🐚", "🏖️", "🏝️", "🌊", "🦩"]
            },
            desert: { 
                bg: 'linear-gradient(to bottom, #b85d19, #5c2c04)', 
                boardBg: 'linear-gradient(to bottom, #d9b473, #a68142)', 
                light: '#e6c280', dark: '#d9b473', header: '#8c3b03',
                decorations: ["🌵", "🐫", "🦅", "💀", "🏜️"]
            },
            candy: { 
                bg: 'linear-gradient(to top, #ff9a9e 0%, #fecfef 99%)', 
                boardBg: 'linear-gradient(to bottom, #ff70a6, #ff97b7)', 
                light: '#ffeef3', dark: '#ffccd8', header: '#7209b7',
                decorations: ["🍬", "🍭", "🍫", "🧁", "🍩", "🦄"]
            },
            forest: { 
                bg: 'linear-gradient(to bottom, #132a13, #432818)', 
                boardBg: 'linear-gradient(to bottom, #1b4332, #2d6a4f)', 
                light: '#40916c', dark: '#2d6a4f', header: '#5c3d2e',
                decorations: ["🌲", "🐻", "🌳", "🍄", "🦊", "🐾", "🪵"]
            },
            magma: { 
                bg: 'linear-gradient(to bottom, #1a0f0f, #000000)', 
                boardBg: 'linear-gradient(45deg, #111111, #260500)', 
                light: '#ba2d13', dark: '#4a0e05', header: '#e05300',
                decorations: ["🌋", "🔥", "☄️", "💀", "👿"]
            },
            space: { 
                bg: 'radial-gradient(circle, #2c003e 0%, #050014 100%)', 
                boardBg: 'linear-gradient(to bottom, #03001e, #1f003a)', 
                light: '#7303c0', dark: '#3a0066', header: '#240046',
                decorations: ["🚀", "🪐", "👽", "⭐️", "☄️", "🛰️"]
            },
            snow: { 
                bg: 'linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 100%)', 
                boardBg: 'linear-gradient(to bottom, #ffffff, #e9ecef)', 
                light: '#f8f9fa', dark: '#dee2e6', header: '#495057',
                decorations: ["❄️", "☃️", "🐧", "🐻‍❄️", "🏔️"]
            },
            cyber: { 
                bg: 'linear-gradient(135deg, #0f172a 0%, #020617 100%)', 
                boardBg: '#1e1b4b', light: '#312e81', dark: '#ff007f', header: '#4338ca',
                decorations: ["⚡", "👾", "🤖", "🌐", "🥽"]
            },
            retro: { 
                bg: '#000000', boardBg: '#111111', light: '#222222', dark: '#0a0a0a', header: '#333333',
                decorations: ["🕹️", "👾", "📀", "🏰", "📢"]
            }
        };

        const foodCategories = {
            "Fruits": ["🍎","🍏","🍐","🍊","🍋","🍌","🍉","🍇","🍓","🫐","🍈","🍒","🍑","🥭","🍍","🥥","🥝","🍅","🫒"],
            "Vegetables": ["🍆","🥑","🥦","🥬","🥒","🌶️","🫑","🌽","🥕","🧄","🧅","🥔","🍠","🍄","🥜","🌰"],
            "Bakery & Breakfast": ["🥐","🥯","🍞","🥖","🥨","🧀","🥚","🍳","🥞","🧇","🥓"],
            "Main Meals": ["🥩","🍗","🍖","🌭","🍔","🍟","🍕","🫓","🥪","🌮","🌯","🫔","🥗","🍿","🍱","🍘","🍙","🍚","🍛","🍜","🍝","🍢","🍣","🍤","🦪","🥟","🍲","🫕"],
            "Sweets & Desserts": ["🎂","🍰","🧁","🥧","🍫","🍬","🍭","🍮","🍯","🍩","🍪","🍧","🍨","🍦"],
            "Drinks": ["🍼","🥛","☕","🫖","🍵","🥤","🧃","🧉","🍺","🍷","🥂","🍹"],
            "Animals & Critters": ["🐸","🐵","🐔","🐧","🐦","🐤","🐣","🦅","🦆","🦢","🦉","🦤","🦩","🦚","🦜","🐱","🐶","🐷","🐹","🐰","🦊","🐻","🐼","🐻‍❄️","🐨","🐯","🦁","🐮"],
            "Sports & Games": ["⚽","🏀","🏈","⚾","🥎","🎾","🏐","🏉","🥏","🎱","🪀","🏓","🏸","🏒","🥍","🏏","🏹","🎣","🎮","🎲","🧩","♟️"],
            "Valuables & Objects": ["💎","👑","💍","💄","🎒","💼","🕶️","👓","🧣","🧤","🎩","👑","🪙","💵","💶","💷","🔮","🧿","🪄","🎈","🎉","🎇"],
            "Flags & Misc": ["🏁","🚩","🎌","🏴‍☠️","💘","💝","💖","💗","💓","💞","💕","💟","❣️","❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎"]
        };

        function populateFoodDropdown() {
            let totalCount = 1;
            for (const [category, items] of Object.entries(foodCategories)) {
                const group = document.createElement('optgroup');
                group.label = category;
                
                items.forEach(emoji => {
                    const opt = document.createElement('option');
                    opt.value = emoji;
                    opt.textContent = `${totalCount}. ${emoji}`;
                    group.appendChild(opt);
                    totalCount++;
                });
                optFoodType.appendChild(group);
            }
            optFoodType.selectedIndex = 0;
        }

        function createGrid() {
            document.querySelectorAll('.grid-tile').forEach(el => el.remove());
            const currentTheme = themes[optMapTheme.value];
            
            for (let row = 0; row < gridCount; row++) {
                for (let col = 0; col < gridCount; col++) {
                    const tile = document.createElement('div');
                    tile.classList.add('grid-tile');
                    tile.style.left = `${col * tileSize}px`;
                    tile.style.top = `${row * tileSize}px`;
                    
                    tile.style.backgroundColor = ((row + col) % 2 !== 0) ? currentTheme.dark : currentTheme.light;
                    board.insertBefore(tile, board.firstChild);
                }
            }
        }

        // Spawns environmental static items around the viewport canvas
        function spawnThemeDecorations(themeKey) {
            decorContainer.innerHTML = '';
            const activeTheme = themes[themeKey];
            
            for (let i = 0; i < 16; i++) {
                const item = document.createElement('div');
                item.classList.add('ambient-item');
                item.textContent = activeTheme.decorations[Math.floor(Math.random() * activeTheme.decorations.length)];
                
                item.style.left = `${Math.random() * 92}%`;
                item.style.top = `${Math.random() * 92}%`;
                item.style.fontSize = `${24 + Math.random() * 16}px`;
                item.style.animationDelay = `${Math.random() * 2}s`;
                
                decorContainer.appendChild(item);
            }
        }

        function updateMapTheme() {
            const currentTheme = themes[optMapTheme.value];
            
            document.body.style.background = currentTheme.bg;
            board.style.background = currentTheme.boardBg;
            document.getElementById('score-bar').style.backgroundColor = currentTheme.header;
            
            createGrid();
            spawnThemeDecorations(optMapTheme.value);
        }

        function updateStyles() {
            colorHexSpan.textContent = optSnakeColor.value.toUpperCase();
            document.querySelectorAll('.snake-head, .snake-body').forEach(el => {
                el.style.backgroundColor = optSnakeColor.value;
            });
        }

        function updateFoodIcon() {
            scoreIconEl.textContent = optFoodType.value;
            document.querySelectorAll('.food-item').forEach(el => el.textContent = optFoodType.value);
        }

        function updateSpeed() {
            if (gameRunning) {
                clearInterval(gameInterval);
                gameInterval = setInterval(mainGameLoop, parseInt(optGameSpeed.value));
            }
        }

        // Leaderboard Management
        function loadLeaderboard() {
            leaderboardList.innerHTML = "";
            let scores = JSON.parse(localStorage.getItem('snake_leaderboard')) || [
                {name: "GoogleSnake", score: 25},
                {name: "ChompMaster", score: 15},
                {name: "NokiaFan", score: 8}
            ];
            scores.sort((a,b) => b.score - a.score);
            scores.slice(0, 7).forEach(entry => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${entry.name}</span> <span>${entry.score} pts</span>`;
                leaderboardList.appendChild(li);
            });
            
            if(scores.length > 0) {
                highScoreEl.textContent = scores[0].score;
            }
        }

        function saveScoreToLeaderboard(finalScore) {
            let name = playerNameInput.value.trim() || "Anonymous";
            let scores = JSON.parse(localStorage.getItem('snake_leaderboard')) || [];
            scores.push({name: name, score: finalScore});
            localStorage.setItem('snake_leaderboard', JSON.stringify(scores));
            loadLeaderboard();
        }

        function startGame() {
            clearBoardElements();
            
            snake = [
                { x: 100, y: 200 },
                { x: 80, y: 200 },
                { x: 60, y: 200 }
            ];
            dx = tileSize;
            dy = 0;
            score = 0;
            scoreEl.textContent = score;
            overlay.style.display = 'none';
            nameInputBox.style.display = 'none';
            gameRunning = true;
            changingDirection = false;

            foodList = [];
            const targetFoodCount = parseInt(optFoodAmount.value);
            for (let i = 0; i < targetFoodCount; i++) {
                spawnFoodItem();
            }

            drawFood();
            drawSnake();
            
            clearInterval(gameInterval);
            gameInterval = setInterval(mainGameLoop, parseInt(optGameSpeed.value));
        }

        function mainGameLoop() {
            if (hasGameEnded()) {
                gameOver();
                return;
            }
            changingDirection = false;
            clearBoardElements();
            moveSnake();
            drawFood();
            drawSnake();
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            let ateFoodIndex = -1;
            for (let i = 0; i < foodList.length; i++) {
                if (head.x === foodList[i].x && head.y === foodList[i].y) {
                    ateFoodIndex = i;
                    break;
                }
            }

            if (ateFoodIndex !== -1) {
                score += 1;
                scoreEl.textContent = score;
                foodList.splice(ateFoodIndex, 1);
                spawnFoodItem();
            } else {
                snake.pop();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                const snakePart = document.createElement('div');
                snakePart.classList.add(index === 0 ? 'snake-head' : 'snake-body');
                snakePart.style.left = `${part.x}px`;
                snakePart.style.top = `${part.y}px`;
                snakePart.style.backgroundColor = optSnakeColor.value;
                
                if (index === 0 && optAccessory.value !== "") {
                    const accessory = document.createElement('div');
                    accessory.classList.add('accessory-slot');
                    accessory.textContent = optAccessory.value;
                    snakePart.appendChild(accessory);
                }
                
                board.appendChild(snakePart);
            });
        }

        function spawnFoodItem() {
            let newFood = { x: 0, y: 0 };
            let validLocation = false;
            while (!validLocation) {
                newFood.x = Math.floor(Math.random() * gridCount) * tileSize;
                newFood.y = Math.floor(Math.random() * gridCount) * tileSize;
                validLocation = true;
                snake.forEach(part => {
                    if (part.x === newFood.x && part.y === newFood.y) validLocation = false;
                });
                foodList.forEach(food => {
                    if (food.x === newFood.x && food.y === newFood.y) validLocation = false;
                });
            }
            foodList.push(newFood);
        }

        function drawFood() {
            foodList.forEach(food => {
                const foodEl = document.createElement('div');
                foodEl.classList.add('food-item');
                foodEl.style.left = `${food.x}px`;
                foodEl.style.top = `${food.y}px`;
                foodEl.textContent = optFoodType.value;
                board.appendChild(foodEl);
            });
        }

        function clearBoardElements() {
            document.querySelectorAll('.snake-head, .snake-body, .food-item').forEach(el => el.remove());
        }

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37; const UP = 38; const RIGHT = 39; const DOWN = 40;
            if (changingDirection) return;
            const goingUp = dy === -tileSize;
            const goingDown = dy === tileSize;
            const goingRight = dx === tileSize;
            const goingLeft = dx === -tileSize;

            if (keyPressed === LEFT && !goingRight) { dx = -tileSize; dy = 0; changingDirection = true; }
            if (keyPressed === UP && !goingDown) { dx = 0; dy = -tileSize; changingDirection = true; }
            if (keyPressed === RIGHT && !goingLeft) { dx = tileSize; dy = 0; changingDirection = true; }
            if (keyPressed === DOWN && !goingUp) { dx = 0; dy = tileSize; changingDirection = true; }
        }

        function hasGameEnded() {
            if (snake[0].x < 0 || snake[0].x >= board.clientWidth || snake[0].y < 0 || snake[0].y >= board.clientHeight) return true;
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return false;
        }

        function gameOver() {
            clearInterval(gameInterval);
            gameRunning = false;
            
            saveScoreToLeaderboard(score);
            
            overlayText.textContent = "Game Over";
            startBtn.textContent = "Play Again";
            nameInputBox.style.display = 'flex';
            overlay.style.display = 'flex';
        }

        window.addEventListener('keydown', changeDirection);
        
        // Initial setup
        populateFoodDropdown();
        updateMapTheme();
        loadLeaderboard();
        nameInputBox.style.display = 'flex';
    </script>
</body>
</html>
